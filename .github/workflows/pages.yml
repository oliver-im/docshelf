name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      - name: Register the README demo
        run: cp .github/pages-shelf.json shelf.local.json

      - run: npm test

      - name: Check the Pages build
        run: npm run check
        env:
          DOCSHELF_SITE: ${{ steps.pages.outputs.origin }}
          DOCSHELF_BASE: ${{ steps.pages.outputs.base_path }}
          DOCSHELF_LIVE_UPDATES: 'false'

      - name: Build the Pages site
        run: npm run build
        env:
          DOCSHELF_SITE: ${{ steps.pages.outputs.origin }}
          DOCSHELF_BASE: ${{ steps.pages.outputs.base_path }}
          DOCSHELF_LIVE_UPDATES: 'false'

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
